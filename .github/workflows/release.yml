# Copied, then modified, from: https://code.visualstudio.com/api/working-with-extensions/continuous-integration#github-actions
on:
  release:
    types:
    - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 26.x
    - name: Get Version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Install Dependencies
      run: npm ci
    - name: Run Unit Tests
      run: xvfb-run -a npm test
      if: runner.os == 'Linux'
    - name: Generate SBOM
      run: npm sbom --sbom-format=cyclonedx --sbom-type=application > wildboar-asn1.cdx.json
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wildboar-asn1-${{ steps.version.outputs.version }}.sbom.json
        path: wildboar-asn1.cdx.json
    - name: Install vsce
      run: npm install --no-save @vscode/vsce
    - name: Create package
      run: npx @vscode/vsce package
    - name: Upload VSIX
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wildboar-asn1-${{ steps.version.outputs.version }}.vsix
        path: asn1-${{ steps.version.outputs.version }}.vsix
        if-no-files-found: error
        retention-days: 90
    - name: Publish to VS Code Extensions Marketplace
      if: success() && startsWith(github.ref, 'refs/tags/')
      run: npx vsce publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
    - name: Install ovsx
      run: npm install --no-save ovsx
    - name: Publish to Open VSX
      run: npx ovsx publish ./*.vsix -p "$OVSX_PAT"
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
