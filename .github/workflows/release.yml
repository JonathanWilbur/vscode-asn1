# Copied, then modified, from: https://code.visualstudio.com/api/working-with-extensions/continuous-integration#github-actions
on:
  release:
    types:
    - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
    - name: Install Dependencies
      run: npm ci
    - name: Run Unit Tests
      run: xvfb-run -a npm test
      if: runner.os == 'Linux'
    - name: Generate SBOM
      run: npm sbom --sbom-format=cyclonedx --sbom-type=application > wildboar-asn1-vscode-extension.cdx.json
    - name: Upload SBOM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sbom
        path: wildboar-asn1-vscode-extension.cdx.json
    - name: Install vsce
      run: npm install --no-save @vscode/vsce
    - name: Create package
      run: npx @vscode/vsce package
    - name: Publish to VS Code Extensions Marketplace
      if: success() && startsWith(github.ref, 'refs/tags/')
      run: npx vsce publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
    - name: Install ovsx
      run: npm install --no-save ovsx
    - name: Publish to Open VSX
      run: npx ovsx publish ./*.vsix -p "$OVSX_PAT"
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
